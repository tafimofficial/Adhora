[package]
name = "adhora_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "adhora_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
grammers-client = "0.12.0"
grammers-session = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-tl-types = "0.12.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
log = "0.4"
android_logger = "0.14"
mime_guess = "2.0"
once_cell = "1.19"
anyhow = "1.0"
bytes = "1.7"
futures-util = "0.3"
url = "2.5"
